<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1504 1010" font-family="'Courier Prime','Courier New',monospace">
  <title>Scatter Lab — data pipeline</title>
  <defs>
    <filter id="hs" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#111111" flood-opacity="1"/>
    </filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#EB1A26"/>
    </marker>
  </defs>
  <style>
    text { fill:#111111; }
    .wt { fill:#ffffff; }
    .lane { font-size:13px; font-weight:700; letter-spacing:2px; }
    .bt   { font-size:14px; font-weight:700; }
    .bt18 { font-size:18px; font-weight:700; }
    .b12  { font-size:12px; }
    .n11  { font-size:11px; fill:#555555; }
    .n10  { font-size:10.5px; fill:#555555; }
    .red12{ font-size:12px; font-weight:700; fill:#EB1A26; }
    .box  { fill:#ffffff; stroke:#111111; stroke-width:2.5; }
    .flow { stroke:#111111; stroke-width:2.5; fill:none; }
    .dash { stroke-dasharray:7 5; }
  </style>

  <rect x="0" y="0" width="1504" height="1010" fill="#ffffff"/>

  <!-- title row -->
  <rect x="32" y="22" width="22" height="22" fill="#0045AD" stroke="#111111" stroke-width="2"/>
  <circle cx="78" cy="33" r="12" fill="#EB1A26" stroke="#111111" stroke-width="2"/>
  <path d="M106,45 L118,21 L130,45 Z" fill="#FFD600" stroke="#111111" stroke-width="2"/>
  <text x="152" y="41" font-size="21" font-weight="700" letter-spacing="2">SCATTER LAB — DATA PIPELINE</text>
  <text x="1480" y="40" text-anchor="end" class="n11">system diagram 01/02 · 02 = the assistant</text>

  <!-- browser boundary -->
  <rect x="24" y="70" width="1464" height="896" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="12 7"/>
  <rect x="48" y="54" width="612" height="32" fill="#111111"/>
  <text x="354" y="75" text-anchor="middle" class="wt" font-size="12" font-weight="700" letter-spacing="1">ALL COMPUTE IN THE BROWSER — NO BACKEND · DATA NEVER LEAVES THE MACHINE</text>

  <!-- lane headers -->
  <text x="56"   y="146" class="lane">IMPORT</text>
  <text x="316"  y="146" class="lane">INGEST</text>
  <text x="608"  y="146" class="lane">THE TABLE</text>
  <text x="924"  y="146" class="lane">WORKBENCH · SIDEBAR 2–6</text>
  <text x="1264" y="146" class="lane">RENDER</text>
  <line x1="56"   y1="156" x2="274"  y2="156" stroke="#111111" stroke-width="2"/>
  <line x1="316"  y1="156" x2="568"  y2="156" stroke="#111111" stroke-width="2"/>
  <line x1="608"  y1="156" x2="884"  y2="156" stroke="#111111" stroke-width="2"/>
  <line x1="924"  y1="156" x2="1224" y2="156" stroke="#111111" stroke-width="2"/>
  <line x1="1264" y1="156" x2="1480" y2="156" stroke="#111111" stroke-width="2"/>

  <!-- ═══ LANE 1 · IMPORT ═══ -->
  <rect x="56" y="170" width="218" height="100" class="box" filter="url(#hs)"/>
  <rect x="70" y="184" width="20" height="20" fill="#EB1A26" stroke="#111111" stroke-width="2"/>
  <text x="80" y="199" text-anchor="middle" class="wt" font-size="12" font-weight="700">1</text>
  <text x="100" y="199" class="bt">FILE DROP</text>
  <text x="70" y="226" class="b12">.csv · .xlsx · .parquet</text>
  <text x="70" y="245" class="n11">sidebar step 1 — Data</text>

  <rect x="56" y="298" width="218" height="84" class="box" filter="url(#hs)"/>
  <text x="70" y="322" class="bt">DEMO DATA</text>
  <text x="70" y="345" class="b12">fetch /demo/*.csv</text>
  <text x="70" y="364" class="n11">synthetic survey · 300 rows</text>

  <rect x="56" y="410" width="218" height="94" class="box" filter="url(#hs)"/>
  <text x="70" y="434" class="bt">WORKSPACE FILE</text>
  <text x="70" y="457" class="b12">.scatterlab.json</text>
  <text x="70" y="476" class="n11">full snapshot incl. tables</text>

  <!-- ═══ LANE 2 · INGEST ═══ -->
  <rect x="316" y="170" width="252" height="190" class="box" filter="url(#hs)"/>
  <text x="330" y="196" class="bt">PARSE — parse.ts</text>
  <text x="330" y="224" class="b12">PapaParse → .csv</text>
  <text x="330" y="244" class="b12">SheetJS   → .xlsx</text>
  <text x="330" y="264" class="b12">hyparquet → .parquet</text>
  <text x="330" y="292" class="n11">parsers lazy-loaded on demand</text>
  <text x="330" y="310" class="n11">typed cells · BigInt → number</text>

  <rect x="316" y="390" width="252" height="128" class="box" filter="url(#hs)"/>
  <text x="330" y="416" class="bt">NORMALIZE — table.ts</text>
  <text x="330" y="444" class="b12">'' · NaN · ±Inf → null</text>
  <text x="330" y="464" class="b12">bool → 0|1 · Date → ISO</text>
  <text x="330" y="484" class="b12">rows → one array per column</text>

  <rect x="316" y="558" width="252" height="160" class="box" filter="url(#hs)"/>
  <rect x="488" y="546" width="68" height="20" fill="#FFD600" stroke="#111111" stroke-width="2"/>
  <text x="522" y="560" text-anchor="middle" font-size="10" font-weight="700">OPTIONAL</text>
  <text x="330" y="584" class="bt">PROJECT — engine.ts</text>
  <text x="330" y="612" class="b12">components file supplied?</text>
  <text x="330" y="632" class="b12">vars ∩ loadings → impute</text>
  <text x="330" y="652" class="b12">→ z-score → scores = X·L</text>
  <text x="330" y="674" class="n11">adds PC1–PC3 · top loadings</text>
  <text x="330" y="692" class="n11">(the demo takes this path)</text>

  <!-- ═══ LANE 3 · THE TABLE ═══ -->
  <rect x="608" y="170" width="276" height="280" fill="#FFD600" stroke="#111111" stroke-width="2.5" filter="url(#hs)"/>
  <text x="630" y="204" class="bt18">DataTable</text>
  <text x="630" y="224" font-size="11">the shared columnar object</text>
  <text x="630" y="254" class="b12">{ columns: string[]</text>
  <text x="630" y="274" class="b12">  data: { col → cells[] }</text>
  <text x="630" y="294" class="b12">  nRows: number }</text>
  <g stroke="#111111" stroke-width="1.5">
    <rect x="650" y="316" width="14" height="12" fill="#ffffff"/><rect x="650" y="331" width="14" height="12" fill="#ffffff"/><rect x="650" y="346" width="14" height="12" fill="#ffffff"/><rect x="650" y="361" width="14" height="12" fill="#ffffff"/>
    <rect x="672" y="316" width="14" height="12" fill="#ffffff"/><rect x="672" y="331" width="14" height="12" fill="#ffffff"/><rect x="672" y="346" width="14" height="12" fill="#ffffff"/><rect x="672" y="361" width="14" height="12" fill="#ffffff"/>
    <rect x="694" y="316" width="14" height="12" fill="#ffffff"/><rect x="694" y="331" width="14" height="12" fill="#ffffff"/><rect x="694" y="346" width="14" height="12" fill="#ffffff"/><rect x="694" y="361" width="14" height="12" fill="#ffffff"/>
    <rect x="716" y="316" width="14" height="12" fill="#ffffff"/><rect x="716" y="331" width="14" height="12" fill="#ffffff"/><rect x="716" y="346" width="14" height="12" fill="#ffffff"/><rect x="716" y="361" width="14" height="12" fill="#ffffff"/>
    <rect x="738" y="316" width="14" height="12" fill="#EB1A26"/><rect x="738" y="331" width="14" height="12" fill="#EB1A26"/><rect x="738" y="346" width="14" height="12" fill="#EB1A26"/><rect x="738" y="361" width="14" height="12" fill="#EB1A26"/>
  </g>
  <text x="630" y="396" font-size="11">new columns append in place —</text>
  <text x="630" y="414" font-size="11">scores become plottable vars</text>

  <rect x="608" y="490" width="276" height="150" class="box" filter="url(#hs)"/>
  <text x="622" y="516" class="bt">SESSION STATE — page.tsx</text>
  <text x="622" y="544" class="b12">datasets[] · one active</text>
  <text x="622" y="564" class="b12">axes auto-pick (PCs first)</text>
  <text x="622" y="584" class="b12">colorBy · shapeBy · camera</text>
  <text x="622" y="604" class="b12">transfer cols ⇄ datasets</text>
  <text x="622" y="624" class="n11">pins ≤3 · notes · 2 themes</text>

  <rect x="608" y="680" width="276" height="120" class="box" filter="url(#hs)"/>
  <text x="622" y="706" class="bt">PERSIST — workspaces.ts</text>
  <text x="622" y="734" class="b12">IndexedDB 'scatter-lab'</text>
  <text x="622" y="754" class="b12">tables deduped by identity</text>
  <text x="622" y="774" class="b12">export ⇄ import .json file</text>

  <!-- ═══ LANE 4 · WORKBENCH ═══ -->
  <rect x="924" y="170" width="300" height="112" class="box" filter="url(#hs)"/>
  <rect x="938" y="184" width="20" height="20" fill="#0045AD" stroke="#111111" stroke-width="2"/>
  <text x="948" y="199" text-anchor="middle" class="wt" font-size="12" font-weight="700">2</text>
  <text x="968" y="199" class="bt">VARIABLES</text>
  <text x="938" y="226" class="b12">every column profiled:</text>
  <text x="938" y="246" class="b12">kind · range · NA · histogram</text>
  <text x="938" y="266" class="b12">one-click X·Y·Z·color·shape</text>

  <rect x="924" y="310" width="300" height="148" class="box" filter="url(#hs)"/>
  <rect x="938" y="324" width="20" height="20" fill="#FFD600" stroke="#111111" stroke-width="2"/>
  <text x="948" y="339" text-anchor="middle" font-size="12" font-weight="700">3</text>
  <text x="968" y="339" class="bt">PCA — pca.ts</text>
  <text x="938" y="366" class="b12">impute → standardize →</text>
  <text x="938" y="386" class="b12">corr matrix → Jacobi eigen</text>
  <text x="938" y="406" class="b12">scores·loadings·scree·labels</text>
  <text x="938" y="432" class="red12">+PC1_‹label›… +COMP_‹label›</text>

  <rect x="924" y="486" width="300" height="92" class="box" filter="url(#hs)"/>
  <rect x="938" y="500" width="20" height="20" fill="#EB1A26" stroke="#111111" stroke-width="2"/>
  <text x="948" y="515" text-anchor="middle" class="wt" font-size="12" font-weight="700">4</text>
  <text x="968" y="515" class="bt">VIEW</text>
  <text x="938" y="542" class="b12">2D/3D · camera · auto-rotate</text>
  <text x="938" y="562" class="b12">axis labels · zoom window</text>

  <rect x="924" y="606" width="300" height="152" class="box" filter="url(#hs)"/>
  <rect x="938" y="620" width="20" height="20" fill="#0045AD" stroke="#111111" stroke-width="2"/>
  <text x="948" y="635" text-anchor="middle" class="wt" font-size="12" font-weight="700">5</text>
  <text x="968" y="635" class="bt">CLUSTER — cluster.ts</text>
  <text x="938" y="662" class="b12">runs on the plotted axes</text>
  <text x="938" y="682" class="b12">z-score? → DBSCAN | k-means++</text>
  <text x="938" y="702" class="b12">seeded → deterministic runs</text>
  <text x="938" y="722" class="n11">silhouette-by-k · k-distance</text>
  <text x="938" y="746" class="red12">+Cluster</text>

  <rect x="924" y="784" width="300" height="104" class="box" filter="url(#hs)"/>
  <rect x="938" y="798" width="20" height="20" fill="#FFD600" stroke="#111111" stroke-width="2"/>
  <text x="948" y="813" text-anchor="middle" font-size="12" font-weight="700">6</text>
  <text x="968" y="813" class="bt">EXPORT &amp; PIN</text>
  <text x="938" y="840" class="b12">pin ≤3 + live → compare grid</text>
  <text x="938" y="860" class="b12">PNG 2× · GIF · offline HTML</text>

  <!-- ═══ LANE 5 · RENDER ═══ -->
  <rect x="1264" y="170" width="216" height="280" class="box" filter="url(#hs)"/>
  <text x="1278" y="196" class="bt">PLOT — Plotly WebGL</text>
  <rect x="1284" y="212" width="176" height="140" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <g stroke="#dddddd" stroke-width="1">
    <line x1="1328" y1="212" x2="1328" y2="352"/><line x1="1372" y1="212" x2="1372" y2="352"/><line x1="1416" y1="212" x2="1416" y2="352"/>
    <line x1="1284" y1="247" x2="1460" y2="247"/><line x1="1284" y1="282" x2="1460" y2="282"/><line x1="1284" y1="317" x2="1460" y2="317"/>
  </g>
  <g fill="#0045AD" stroke="#111111" stroke-width="1.25">
    <rect x="1294" y="302" width="8" height="8"/><rect x="1308" y="312" width="8" height="8"/><rect x="1302" y="288" width="8" height="8"/><rect x="1318" y="296" width="8" height="8"/><rect x="1312" y="326" width="8" height="8"/>
  </g>
  <g fill="#EB1A26" stroke="#111111" stroke-width="1.25">
    <circle cx="1355" cy="238" r="4.5"/><circle cx="1367" cy="232" r="4.5"/><circle cx="1361" cy="252" r="4.5"/><circle cx="1377" cy="244" r="4.5"/><circle cx="1349" cy="246" r="4.5"/>
  </g>
  <g fill="#FFD600" stroke="#111111" stroke-width="1.25">
    <path d="M1411,324 L1416,315 L1421,324 Z"/><path d="M1423,334 L1428,325 L1433,334 Z"/><path d="M1417,308 L1422,299 L1427,308 Z"/><path d="M1433,318 L1438,309 L1443,318 Z"/><path d="M1405,338 L1410,329 L1415,338 Z"/>
  </g>
  <text x="1456" y="348" text-anchor="end" font-size="9" fill="#555555">PC1</text>
  <text x="1288" y="224" font-size="9" fill="#555555">PC2</text>
  <text x="1278" y="380" class="b12">position x·y·z</text>
  <text x="1278" y="400" class="b12">color: palette|viridis</text>
  <text x="1278" y="420" class="b12">shape: ≤6 symbols</text>
  <text x="1278" y="440" class="n11">mute/hide via legend</text>

  <rect x="1264" y="540" width="216" height="150" class="box" filter="url(#hs)"/>
  <text x="1278" y="566" class="bt">ARTIFACTS</text>
  <rect x="1278" y="582" width="52" height="24" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="1304" y="598" text-anchor="middle" font-size="11" font-weight="700">.png</text>
  <rect x="1338" y="582" width="52" height="24" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="1364" y="598" text-anchor="middle" font-size="11" font-weight="700">.gif</text>
  <rect x="1398" y="582" width="58" height="24" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="1427" y="598" text-anchor="middle" font-size="11" font-weight="700">.html</text>
  <text x="1278" y="634" class="n11">png 2× res · gif rotates</text>
  <text x="1278" y="652" class="n11">html: self-contained,</text>
  <text x="1278" y="670" class="n11">interactive, offline</text>

  <!-- key -->
  <text x="1264" y="744" font-size="13" font-weight="700" letter-spacing="2">KEY</text>
  <line x1="1264" y1="764" x2="1304" y2="764" class="flow" marker-end="url(#aB)"/>
  <text x="1316" y="768" font-size="11">data flow</text>
  <line x1="1268" y1="790" x2="1302" y2="790" stroke="#EB1A26" stroke-width="2.5" marker-start="url(#aR)" marker-end="url(#aR)"/>
  <text x="1316" y="794" font-size="11">derived cols ⇄ table</text>
  <line x1="1264" y1="816" x2="1304" y2="816" class="flow dash"/>
  <text x="1316" y="820" font-size="11">optional / sideload</text>

  <!-- ═══ ARROWS ═══ -->
  <!-- sources → parse -->
  <path d="M274,220 H308" class="flow" marker-end="url(#aB)"/>
  <path d="M274,340 H308" class="flow" marker-end="url(#aB)"/>
  <!-- workspace file → persist (sideload) -->
  <path d="M165,504 V938 H746 V810" class="flow dash" marker-end="url(#aB)"/>
  <text x="200" y="930" class="n10">workspace import — rehydrates tables straight into IndexedDB + state</text>
  <!-- parse → normalize -->
  <path d="M442,360 V382" class="flow" marker-end="url(#aB)"/>
  <!-- normalize → hub -->
  <path d="M568,455 H586 V310 H600" class="flow" marker-end="url(#aB)"/>
  <!-- normalize → project (optional) -->
  <path d="M442,518 V550" class="flow dash" marker-end="url(#aB)"/>
  <text x="452" y="542" class="n10">if components</text>
  <!-- project → hub -->
  <path d="M568,638 H594 V400 H600" class="flow" marker-end="url(#aB)"/>
  <!-- hub ↔ state ↔ persist -->
  <line x1="746" y1="458" x2="746" y2="482" class="flow" marker-start="url(#aB)" marker-end="url(#aB)"/>
  <text x="756" y="474" class="n10">lives in</text>
  <line x1="746" y1="648" x2="746" y2="672" class="flow" marker-start="url(#aB)" marker-end="url(#aB)"/>
  <text x="756" y="664" class="n10">save/load</text>
  <!-- hub → workbench spine -->
  <line x1="884" y1="310" x2="904" y2="310" class="flow"/>
  <line x1="904" y1="226" x2="904" y2="836" stroke="#111111" stroke-width="3"/>
  <path d="M904,226 H914" class="flow" marker-end="url(#aB)"/>
  <line x1="888" y1="384" x2="918" y2="384" stroke="#EB1A26" stroke-width="2.5" marker-start="url(#aR)" marker-end="url(#aR)"/>
  <path d="M904,532 H914" class="flow" marker-end="url(#aB)"/>
  <line x1="888" y1="682" x2="918" y2="682" stroke="#EB1A26" stroke-width="2.5" marker-start="url(#aR)" marker-end="url(#aR)"/>
  <path d="M904,836 H914" class="flow" marker-end="url(#aB)"/>
  <!-- workbench → plot -->
  <path d="M1224,226 H1256" class="flow" marker-end="url(#aB)"/>
  <path d="M1224,532 H1244 V420 H1256" class="flow" marker-end="url(#aB)"/>
  <!-- plot → artifacts -->
  <path d="M1372,450 V532" class="flow" marker-end="url(#aB)"/>
  <text x="1382" y="488" class="n10">step 6</text>
  <text x="1382" y="502" class="n10">captures</text>

  <!-- footer -->
  <text x="32" y="992" class="n10">source: frontend/src — parse.ts · table.ts · engine.ts · pca.ts · cluster.ts · workspaces.ts · page.tsx</text>
  <text x="1480" y="992" text-anchor="end" class="n10">scatter-lab.vercel.app</text>
</svg>
